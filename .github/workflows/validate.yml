name: validate

on:
    push:
    pull_request:

jobs:
    tier1:
        name: Tier-1 static validation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  # Python 3.14+ is the marketplace's declared floor — the
                  # formatter pass runs reorder-python-imports --py314-plus, so
                  # CI must not be older than what the source is written for.
                  python-version: "3.14"
            - name: Install test deps
              run: pip install -r tests/requirements.txt
            - name: Run Tier-1 suite
              run: python -m pytest tests/ -q
